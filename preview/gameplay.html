  function drawEnemyBullets() {
    enemyBullets.forEach(b => {
      ctx.save();
      if (b.kind === 'fireball') {
        const r = b.r || BOSS_FIREBALL_RADIUS;
        const pulse = 0.92 + 0.08 * Math.sin(gameTime * 0.012 + b.x * 0.02);
        const outer = r * 2.4 * pulse;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, outer);
        grad.addColorStop(0, 'rgba(240, 253, 255, 0.98)');
        grad.addColorStop(0.18, 'rgba(186, 230, 253, 0.95)');
        grad.addColorStop(0.42, 'rgba(56, 189, 248, 0.9)');
        grad.addColorStop(0.68, 'rgba(14, 165, 233, 0.65)');
        grad.addColorStop(0.88, 'rgba(30, 64, 175, 0.35)');
        grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(34, 211, 238, 0.85)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(b.x, b.y, outer, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(224, 242, 254, 0.45)';
        ctx.beginPath();
        ctx.arc(b.x - r * 0.25, b.y - r * 0.25, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const r = 4;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r * 2.2);
        grad.addColorStop(0, 'rgba(248, 250, 252, 0.95)');
        grad.addColorStop(0.45, 'rgba(248, 150, 141, 0.9)');
        grad.addColorStop(1, 'rgba(127, 29, 29, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, r * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  function drawEnemyHealthBar(e, halfExtentAboveCenter) {
    if (!e.maxHealth || e.maxHealth <= 0) return;
    const barWidth = e.size + 8;
    const barHeight = 5;
    const healthRatio = Math.max(0, Math.min(1, e.health / e.maxHealth));
    ctx.save();
    ctx.translate(e.x, e.y - halfExtentAboveCenter - 10);
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(15, 23, 42, 0.9)';
    ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
    ctx.beginPath();
    ctx.roundRect(-barWidth / 2, -barHeight / 2, barWidth, barHeight, 2);
    ctx.fill();
    ctx.stroke();
    const filledWidth = (barWidth - 2) * healthRatio;
    const grad = ctx.createLinearGradient(-barWidth / 2, 0, barWidth / 2, 0);
    grad.addColorStop(0, 'rgba(74, 222, 128, 0.95)');
    grad.addColorStop(0.5, 'rgba(234, 179, 8, 0.95)');
    grad.addColorStop(1, 'rgba(248, 113, 113, 0.95)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-barWidth / 2 + 1, -barHeight / 2 + 1, filledWidth, barHeight - 2, 1.5);
    ctx.fill();
    ctx.restore();
  }

  function drawEnemies() {
    enemies.forEach(e => {
      if (e.isBoss && bossL1Img.complete && bossL1Img.naturalWidth) {
        const nw = bossL1Img.naturalWidth;
        const nh = bossL1Img.naturalHeight;
        const scale = e.size / Math.max(nw, nh);
        const dw = nw * scale;
        const dh = nh * scale;
        ctx.drawImage(bossL1Img, e.x - dw / 2, e.y - dh / 2, dw, dh);
        drawEnemyHealthBar(e, dh / 2);
        return;
      }
      const img = fodderImageForEnemy(e);
      let halfAbove = e.size / 2;
      if (img.complete && img.naturalWidth) {
        const nw = img.naturalWidth;
        const nh = img.naturalHeight;
        const scale = e.size / Math.max(nw, nh);
        const dw = nw * scale;
        const dh = nh * scale;
        ctx.drawImage(img, e.x - dw / 2, e.y - dh / 2, dw, dh);
        halfAbove = dh / 2;
        drawEnemyHealthBar(e, halfAbove);
        return;
      }
      if (e.type === 'diamond') {
        const s = e.size / 2;
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = '#22d3ee';
        ctx.fillStyle = 'rgba(34,211,238,0.5)';
        ctx.shadowColor = 'rgba(34,211,238,0.8)';
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.strokeRect(-s, -s, e.size, e.size);
        ctx.fillRect(-s + 4, -s + 4, e.size - 8, e.size - 8);
        ctx.restore();
        drawEnemyHealthBar(e, s * Math.SQRT2);
      } else {
        ctx.save();
        ctx.strokeStyle = '#ec5b13';
        ctx.fillStyle = 'transparent';
        ctx.shadowColor = 'rgba(236,91,19,0.6)';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size / 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size / 4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        drawEnemyHealthBar(e, e.size / 2);
      }
    });
  }

  function drawPickups() {
    const r = PICKUP_SIZE / 2;
    pickups.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (upgradePickupImg.complete && upgradePickupImg.naturalWidth) {
        const nw = upgradePickupImg.naturalWidth;
        const nh = upgradePickupImg.naturalHeight;
        const fitScale = Math.min(PICKUP_SIZE / nw, PICKUP_SIZE / nh);
        const w = nw * fitScale;
        const h = nh * fitScale;
        ctx.shadowColor = 'rgba(34, 211, 238, 0.4)';
        ctx.shadowBlur = 10;
        ctx.drawImage(upgradePickupImg, -w / 2, -h / 2, w, h);
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(34, 211, 238, 0.6)';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(236, 91, 19, 0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawVictorySparks() {
    if (!victorySparks.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    victorySparks.forEach(s => {
      const t = s.life / s.maxLife;
      const a = Math.max(0, 1 - t);
      const rgb = VIBGYOR_SPARK_RGB[s.colorIdx];
      const pr = s.r * (1 + 0.45 * t);
      ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${0.82 * a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, pr, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawVictoryAwesome(now) {
    if (victoryState !== 'flyout') return;
    const elapsed = now - victoryPhaseStartAt;
    const u = Math.min(1, elapsed / (VICTORY_FLYOUT_MS * 0.38));
    const alpha = u < 0.18 ? u / 0.18 : Math.max(0, 1 - (u - 0.48) / 0.52);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "700 44px 'Space Grotesk', 'Public Sans', sans-serif";
    ctx.fillStyle = `rgba(170, 241, 255, ${0.94 * alpha})`;
    ctx.shadowColor = 'rgba(37, 209, 244, 0.88)';
    ctx.shadowBlur = 24;
    ctx.fillText('Awesome', width / 2, height * 0.36);
    ctx.restore();
  }

  function drawExplosions() {
    explosions.forEach(ex => {
      const t = ex.t / ex.duration;
      const size = EXPLOSION_MAX_SIZE * Math.min(1, t * 2);
      const alpha = 1 - t;
      ctx.save();
      ctx.translate(ex.x, ex.y);
      ctx.fillStyle = `rgba(236, 91, 19, ${0.7 * alpha})`;
      ctx.strokeStyle = `rgba(255, 200, 100, ${0.9 * alpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(236,91,19,0.8)';
      ctx.shadowBlur = 8;
      ctx.fillRect(-size/2, -size/2, size, size);
      ctx.strokeRect(-size/2, -size/2, size, size);
      ctx.restore();
    });
  }

  function drawRipples() {
    if (!ripples.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ripples.forEach(r => {
      const t = Math.max(0, Math.min(1, r.t / r.duration));
      const eased = t * t * (3 - 2 * t);
      const radius = r.maxR * eased;
      const alpha = 0.55 * (1 - t);
      if (alpha <= 0.01) return;
      const cx = r.x;
      const cy = r.y;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      grad.addColorStop(0.00, `rgba(148, 0, 211, ${alpha * 1.0})`);  // violet
      grad.addColorStop(0.15, `rgba(75, 0, 130, ${alpha * 0.95})`);  // indigo
      grad.addColorStop(0.30, `rgba(59, 130, 246, ${alpha * 0.9})`); // blue
      grad.addColorStop(0.45, `rgba(34, 197, 94, ${alpha * 0.85})`); // green
      grad.addColorStop(0.60, `rgba(250, 204, 21, ${alpha * 0.8})`); // yellow
      grad.addColorStop(0.78, `rgba(249, 115, 22, ${alpha * 0.72})`);// orange
      grad.addColorStop(1.00, `rgba(239, 68, 68, 0)`);               // red outer fade
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawNebulae() {
    ctx.fillStyle = '#0a0612';
    ctx.fillRect(0, 0, width, height);

    if (NEBULA_BG_IMAGE_URL && bgCloudsImgReady && bgCloudsImg.naturalWidth) {
      const h = height;
      const w = width;
      const nw = bgCloudsImg.naturalWidth;
      const nh = bgCloudsImg.naturalHeight;
      const coverScale = Math.max(w / nw, h / nh);
      const zoomOut = 0.82;
      const scale = coverScale * zoomOut;
      const srcW = w / scale;
      const srcH = h / scale;
      const sx = (nw - srcW) / 2;
      const sy = (nh - srcH) / 2;
      const res = NEBULA_IMAGE_RES_SCALE;
      const destW = w * res;
      const destH = h * res;
      const destX = w * (1 - res) / 2;
      const scrollY = nebulaImageScrollOffset % h;
      const destY1 = scrollY - h + h * (1 - res) / 2;
      const destY2 = scrollY + h * (1 - res) / 2;
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.globalCompositeOperation = 'luminosity';
      ctx.drawImage(bgCloudsImg, sx, sy, srcW, srcH, destX, destY1, destW, destH);
      ctx.drawImage(bgCloudsImg, sx, sy, srcW, srcH, destX, destY2, destW, destH);
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 1;
    nebulae.forEach(n => {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, n.color);
      g.addColorStop(0.4, n.color.replace(/[\d.]+\)$/, '0.06)'));
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
    ctx.save();
    ctx.filter = 'blur(18px)';
    ctx.globalAlpha = 0.85;
    nebulae.forEach(n => {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 0.9);
      g.addColorStop(0, n.color);
      g.addColorStop(0.6, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function easeOutCubic(t) {
    const u = Math.max(0, Math.min(1, t));
    return 1 - Math.pow(1 - u, 3);
  }

  function drawWave1Pregame(now) {
    if (wave1IntroStartAt == null || wave1IntroEndAt == null || now >= wave1IntroEndAt) return;
    const t = now - wave1IntroStartAt;
    const cx = width * 0.5;
    const cy = height * 0.42;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (t < WAVE1_TITLE_MS) {
      const u = t / WAVE1_TITLE_MS;
      const alpha = u < 0.12 ? u / 0.12 : u > 0.55 ? Math.max(0, 1 - (u - 0.55) / 0.45) : 1;
      const scale = 0.78 + 0.28 * easeOutCubic(Math.min(1, u / 0.35));
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.font = '600 44px Public Sans, system-ui, sans-serif';
      ctx.fillStyle = `rgba(248, 250, 252, ${0.95 * alpha})`;
      ctx.shadowColor = 'rgba(34, 211, 238, 0.65)';
      ctx.shadowBlur = 24;
      ctx.fillText('Wave 1', 0, 0);
    } else {
      const t2 = t - WAVE1_TITLE_MS;
      const idx = Math.min(2, Math.floor(t2 / WAVE1_COUNTDOWN_DIGIT_MS));
      const digit = 3 - idx;
      const localT = (t2 - idx * WAVE1_COUNTDOWN_DIGIT_MS) / WAVE1_COUNTDOWN_DIGIT_MS;
      const alpha = localT < 0.1 ? localT / 0.1 : localT > 0.72 ? Math.max(0, 1 - (localT - 0.72) / 0.28) : 1;
      const scale = 0.65 + 0.5 * Math.sin(Math.PI * Math.min(1, localT * 1.15));
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.font = '700 96px Public Sans, system-ui, sans-serif';
      ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
      ctx.shadowColor = 'rgba(251, 146, 60, 0.9)';
      ctx.shadowBlur = 28;
      ctx.fillText(String(digit), 0, 0);
    }
    ctx.restore();
  }

  function drawBriefWaveTitle(now) {
    if (!briefCenterTitle || now >= briefCenterTitle.until) return;
    const elapsed = now - briefCenterTitle.start;
    const dur = briefCenterTitle.until - briefCenterTitle.start;
    const u = Math.max(0, Math.min(1, elapsed / dur));
    const alpha = u < 0.15 ? u / 0.15 : u > 0.55 ? Math.max(0, 1 - (u - 0.55) / 0.45) : 1;
    const scale = 0.88 + 0.12 * Math.sin(Math.PI * u);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.translate(width * 0.5, height * 0.4);
    ctx.scale(scale, scale);
    ctx.font = '600 40px Public Sans, system-ui, sans-serif';
    ctx.fillStyle = `rgba(248, 250, 252, ${0.92 * alpha})`;
    ctx.shadowColor = 'rgba(236, 91, 19, 0.45)';
    ctx.shadowBlur = 20;
    ctx.fillText(briefCenterTitle.text, 0, 0);
    ctx.restore();
  }

  function drawFlankingBlur() {
    if (flankLeftIntensity <= 0 && flankRightIntensity <= 0) return;
    const edgeWidth = Math.max(32, width * 0.12);
    ctx.save();
    ctx.filter = 'blur(18px)';
    const maxAlpha = 0.65;
    if (flankLeftIntensity > 0) {
      const alpha = maxAlpha * Math.min(1, flankLeftIntensity);
      const grad = ctx.createLinearGradient(0, 0, edgeWidth, 0);
      grad.addColorStop(0, `rgba(239, 68, 68, ${alpha})`);
      grad.addColorStop(0.4, `rgba(239, 68, 68, ${alpha * 0.9})`);
      grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, edgeWidth, height);
    }
    if (flankRightIntensity > 0) {
      const alpha = maxAlpha * Math.min(1, flankRightIntensity);
      const grad = ctx.createLinearGradient(width - edgeWidth, 0, width, 0);
      grad.addColorStop(0, 'rgba(239, 68, 68, 0)');
      grad.addColorStop(0.6, `rgba(239, 68, 68, ${alpha * 0.9})`);
      grad.addColorStop(1, `rgba(239, 68, 68, ${alpha})`);
      ctx.fillStyle = grad;
      ctx.fillRect(width - edgeWidth, 0, edgeWidth, height);
    }
    ctx.restore();
  }

  function draw(now) {
    update(now);
    ctx.clearRect(0, 0, width, height);
    drawNebulae();
    drawRipples();
    drawFlankingBlur();
    drawProjectiles();
    drawEnemyBullets();
    drawEnemies();
    drawExplosions();
    drawVictorySparks();
    drawPickups();
    drawShip();
    if (playerCombatEnabled && currentWeapon === WEAPON_FIRE) drawFireBlasterStream();
    if (playerCombatEnabled && currentWeapon === WEAPON_ELECTRIC) drawElectricShock();
    if (firstWaveSpawnPending && wave1IntroStartAt != null && now < wave1IntroEndAt) {
      drawWave1Pregame(now);
    } else if (briefCenterTitle && now < briefCenterTitle.until) {
      drawBriefWaveTitle(now);
    }
    drawVictoryAwesome(now);
    ctx.save();
    if (!victoryState) {
      ctx.font = '10px Public Sans, sans-serif';
      const weaponLabel = currentWeapon === WEAPON_FIRE ? 'Fire' : currentWeapon === WEAPON_ELECTRIC ? 'Electric' : 'Laser' + (laserTurretPattern === LASER_PATTERN_SINGLE ? ' (1)' : ' (3)');
      ctx.fillStyle = currentWeapon === WEAPON_FIRE ? 'rgba(255, 180, 60, 0.9)' : currentWeapon === WEAPON_ELECTRIC ? 'rgba(180, 220, 255, 0.9)' : 'rgba(34, 211, 238, 0.9)';
      ctx.fillText('Weapon: ' + weaponLabel + (currentWeapon === WEAPON_LASER ? ' [F][T]' : ' [F]'), width - 130, height - 12);
      ctx.fillStyle = 'rgba(236, 91, 19, 0.95)';
      ctx.fillText('Upgrades: ' + upgradeCollectedCount + (shipUpgraded ? ' [U]' : ''), 12, height - 12);

      ctx.fillStyle = 'rgba(248, 250, 252, 0.92)';
      ctx.textAlign = 'right';
      ctx.fillText('Score: ' + score, width - 12, 14);
      ctx.textAlign = 'left';
      ctx.fillText(bossPhase ? 'Boss' : 'Wave ' + currentWaveDisplay, 12, 14);
      if (chainCount > 1 && chainTimerMs > 0) {
        const t = 1 - Math.max(0, Math.min(1, chainTimerMs / CHAIN_TIMEOUT_MS));
        const alpha = 0.4 + 0.4 * (1 - t);
        const label = 'CHAIN x' + chainCount;
        ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
        ctx.textAlign = 'center';
        ctx.fillText(label, width / 2, 24);
      }

      const heartXStart = 12;
      const heartY = 18;
      const heartSpacing = 18;
      for (let i = 0; i < MAX_LIVES; i++) {
        const filled = i < lives;
        const x = heartXStart + i * heartSpacing;
        ctx.save();
        ctx.translate(x, heartY);
        ctx.beginPath();
        const size = 6;
        ctx.moveTo(0, size);
        ctx.bezierCurveTo(-size, 0, -size, -size, 0, -size * 0.4);
        ctx.bezierCurveTo(size, -size, size, 0, 0, size);
        ctx.closePath();
        ctx.fillStyle = filled ? 'rgba(248, 113, 113, 0.95)' : 'rgba(51, 65, 85, 0.9)';
        ctx.strokeStyle = 'rgba(248, 250, 252, 0.9)';
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    if (runEnded) {
      ctx.font = '16px Public Sans, sans-serif';
      ctx.fillStyle = 'rgba(248, 250, 252, 0.96)';
      ctx.textAlign = 'center';
      const label = 'OUT OF LIVES';
      ctx.fillText(label, width / 2, 32);
      ctx.textAlign = 'start';
    }
    ctx.restore();
    rafId = requestAnimationFrame(draw);
  }

  function onPointer(e) {
    const rect = canvas.getBoundingClientRect();
    pointerX = e.clientX - rect.left;
    pointerY = e.clientY - rect.top;
    pointerActive = true;
  }
  function onPointerDown(e) {
    const rect = canvas.getBoundingClientRect();
    pointerDownX = e.clientX - rect.left;
    pointerDownY = e.clientY - rect.top;
  }
  function onPointerEnd() {
    const dx = Math.abs(pointerX - pointerDownX);
    const dy = Math.abs(pointerY - pointerDownY);
    if (dx < 15 && dy < 15 && pointerX >= width - 120 && pointerY <= 36) {
      currentWeapon = currentWeapon === WEAPON_LASER ? WEAPON_FIRE : currentWeapon === WEAPON_FIRE ? WEAPON_ELECTRIC : WEAPON_LASER;
    }
    pointerActive = false;
  }

  canvas.addEventListener('mousedown', e => { onPointerDown(e); onPointer(e); });
  canvas.addEventListener('mousemove', e => { if (e.buttons) onPointer(e); });
  canvas.addEventListener('mouseup', onPointerEnd);
  canvas.addEventListener('mouseleave', onPointerEnd);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e.touches[0]); onPointer(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); onPointer(e.touches[0]); }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); if (!e.touches.length) onPointerEnd(); }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F' || e.key === '2') {
      currentWeapon = currentWeapon === WEAPON_LASER ? WEAPON_FIRE : currentWeapon === WEAPON_FIRE ? WEAPON_ELECTRIC : WEAPON_LASER;
      e.preventDefault();
    }
    if (e.key === '3' || e.key === 'e' || e.key === 'E') {
      currentWeapon = currentWeapon === WEAPON_ELECTRIC ? WEAPON_LASER : WEAPON_ELECTRIC;
      e.preventDefault();
    }
    if (e.key === 'u' || e.key === 'U') {
      shipUpgraded = !shipUpgraded;
      e.preventDefault();
    }
    if ((e.key === 't' || e.key === 'T') && currentWeapon === WEAPON_LASER) {
      laserTurretPattern = laserTurretPattern === LASER_PATTERN_SINGLE ? LASER_PATTERN_SPREAD : LASER_PATTERN_SINGLE;
      e.preventDefault();
    }
  });

  document.getElementById('mc-btn-retry')?.addEventListener('click', function() {
    resetRunState();
  });
  document.getElementById('mc-btn-exit')?.addEventListener('click', function() {
    window.location.href = new URL('index.html', window.location.href).href;
  });

  window.addEventListener('resize', () => { resize(); });
  resize();
  requestAnimationFrame(draw);
})();
  </script>
</body>
